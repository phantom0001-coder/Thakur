name: Thakur Windows Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build (Windows / WebView2 / MSVC)
    runs-on: windows-latest

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      BIN_DIR:   ${{ github.workspace }}/build/bin
      WEBVIEW2_VERSION: ""

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install Microsoft WebView2 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/packages" | Out-Null
          nuget install Microsoft.Web.WebView2 `
            -OutputDirectory "${{ github.workspace }}/packages" `
            -NonInteractive `
            -NoCache
          $pkg = Get-ChildItem "${{ github.workspace }}/packages" -Directory -Filter "Microsoft.Web.WebView2.*" | Select-Object -First 1
          if (-not $pkg) {
            throw "Microsoft.Web.WebView2 package was not installed."
          }
          Write-Host "WebView2 SDK package: $($pkg.FullName)"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B "${{ env.BUILD_DIR }}" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${{ env.BIN_DIR }}"

      - name: Build
        run: cmake --build "${{ env.BUILD_DIR }}" --config Release --parallel

      - name: Validate build output
        shell: pwsh
        run: |
          $exe = "${{ env.BIN_DIR }}\thakur.exe"
          $loader = "${{ env.BIN_DIR }}\WebView2Loader.dll"
          if (-not (Test-Path $exe)) {
            throw "Expected executable not found: $exe"
          }
          if (-not (Test-Path $loader)) {
            throw "Expected WebView2Loader.dll not found: $loader"
          }
          Write-Host "Built: $exe"
          Write-Host "Staged: $loader"

      - name: Collect deployment artifacts
        shell: pwsh
        run: |
          $binDir = "${{ env.BIN_DIR }}"
          $artifactDir = "${{ github.workspace }}/artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item "$binDir\thakur.exe" $artifactDir -Force
          Copy-Item "$binDir\WebView2Loader.dll" $artifactDir -Force
          if (Test-Path "$binDir\thakur_ui") {
            Copy-Item "$binDir\thakur_ui" $artifactDir -Recurse -Force
          }
          Get-ChildItem $artifactDir -Recurse | Select-Object FullName

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: thakur-windows-${{ github.run_number }}
          path: ${{ github.workspace }}/artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## Thakur Build Summary"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "| Property | Value |"
          Add-Content $env:GITHUB_STEP_SUMMARY "|----------|-------|"
          Add-Content $env:GITHUB_STEP_SUMMARY "| Runner | windows-latest |"
          Add-Content $env:GITHUB_STEP_SUMMARY "| UI Host | Native Win32 + WebView2 |"
          Add-Content $env:GITHUB_STEP_SUMMARY "| Config | Release |"
          Add-Content $env:GITHUB_STEP_SUMMARY "| Commit | $env:GITHUB_SHA |"
